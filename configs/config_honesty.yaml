# ===== MULTI-TURN =====

multi_turn:
  llm_generation_config:
    assistant_max_new_tokens: 1024
    assistant_temperature: 0.6
    assistant_top_p: 0.9
    user_max_new_tokens: 256
    user_temperature: 0.6
    user_top_p: 0.9
    enable_thinking: False


# ===== ANALYSIS & JUDGE =====

dynamic_analysis:
  trait: "honesty"
  honesty_category: "self_report_experimental"
  # No system_prompts_path: every scenario in data_path carries its own
  # system_prompt_honest / system_prompt_dishonest pair, which is what the analysis uses.
  # (Compare configs/config_compassion.yaml, where one global pair applies to all prompts.)
  data_path: "honesty/test/generalized/v4/generalized_honesty_test_scenarios.json"
  max_tokens: 2048
  temperature: 0.6
  top_p: 0.9
  n_prompts: 40
  steering_type: "all"
  steering_direction: "positive"
