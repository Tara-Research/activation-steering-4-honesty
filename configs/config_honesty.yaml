# Honesty steering config (logistic-regression vectors, response-average activations).
#
# Artifact paths are relative to PERSONA_VECTORS_FOLDER and follow the templates
# emitted by src/vector_generation:
#   caa/{model}/{trait}/{dataset}/{trait}_{dataset}_{side}_embeddings_response_avg_{model}.pt
#   logistic_regression/{model}/{trait}/{dataset}/{trait}_{dataset}_logreg_{steering_vector|bias}_response_avg_{model}.pt
# data_path is relative to DATA_FOLDER.

generation_defaults:
  temperature: 0.6
  top_p: 0.9
  min_tokens: 1
  batch_size: 100
  max_tokens: 1024
  enable_thinking: False

common_steering_config_Qwen_Qwen3.6-27B_self_report_experimental:
  vector_path: "logistic_regression/Qwen_Qwen3.6-27B/honesty/self_report_experimental/honesty_self_report_experimental_logreg_steering_vector_response_avg_Qwen_Qwen3.6-27B.pt"
  bias_path: "logistic_regression/Qwen_Qwen3.6-27B/honesty/self_report_experimental/honesty_self_report_experimental_logreg_bias_response_avg_Qwen_Qwen3.6-27B.pt"
  pos_embeddings_path: "caa/Qwen_Qwen3.6-27B/honesty/self_report_experimental/honesty_self_report_experimental_honest_embeddings_response_avg_Qwen_Qwen3.6-27B.pt"
  neg_embeddings_path: "caa/Qwen_Qwen3.6-27B/honesty/self_report_experimental/honesty_self_report_experimental_dishonest_embeddings_response_avg_Qwen_Qwen3.6-27B.pt"
  data_path: "honesty/test/generalized/v4/generalized_honesty_test_scenarios.json"

common_steering_config_google_gemma-4-31B-it_self_report_experimental:
  vector_path: "logistic_regression/google_gemma-4-31B-it/honesty/self_report_experimental/honesty_self_report_experimental_logreg_steering_vector_response_avg_google_gemma-4-31B-it.pt"
  bias_path: "logistic_regression/google_gemma-4-31B-it/honesty/self_report_experimental/honesty_self_report_experimental_logreg_bias_response_avg_google_gemma-4-31B-it.pt"
  pos_embeddings_path: "caa/google_gemma-4-31B-it/honesty/self_report_experimental/honesty_self_report_experimental_honest_embeddings_response_avg_google_gemma-4-31B-it.pt"
  neg_embeddings_path: "caa/google_gemma-4-31B-it/honesty/self_report_experimental/honesty_self_report_experimental_dishonest_embeddings_response_avg_google_gemma-4-31B-it.pt"
  data_path: "honesty/test/generalized/v4/generalized_honesty_test_scenarios.json"

common_steering_config_meta-llama_Llama-3.3-70B-Instruct_self_report_experimental:
  vector_path: "logistic_regression/meta-llama_Llama-3.3-70B-Instruct/honesty/self_report_experimental/honesty_self_report_experimental_logreg_steering_vector_response_avg_meta-llama_Llama-3.3-70B-Instruct.pt"
  bias_path: "logistic_regression/meta-llama_Llama-3.3-70B-Instruct/honesty/self_report_experimental/honesty_self_report_experimental_logreg_bias_response_avg_meta-llama_Llama-3.3-70B-Instruct.pt"
  pos_embeddings_path: "caa/meta-llama_Llama-3.3-70B-Instruct/honesty/self_report_experimental/honesty_self_report_experimental_honest_embeddings_response_avg_meta-llama_Llama-3.3-70B-Instruct.pt"
  neg_embeddings_path: "caa/meta-llama_Llama-3.3-70B-Instruct/honesty/self_report_experimental/honesty_self_report_experimental_dishonest_embeddings_response_avg_meta-llama_Llama-3.3-70B-Instruct.pt"
  data_path: "honesty/test/generalized/v4/generalized_honesty_test_scenarios.json"


